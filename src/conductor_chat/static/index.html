<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conductor Chat Search</title>
<style>
  :root {
    --bg: #1e1f22;
    --fg: #e6e6e6;
    --muted: #999;
    --accent: #7aa2f7;
    --row: #26282d;
    --row-hover: #2e3036;
    --code-bg: #14151a;
    --mark-bg: #2d4a87;
    --mark-fg: #fff;
    --border: #3a3c42;
    --error: #f7768e;
    --ok: #9ece6a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-size: 14px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  button { background: var(--row); color: var(--fg); border: 1px solid var(--border); padding: 5px 11px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button:hover { background: var(--row-hover); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  /* Tab strip — sits between header and the per-tab controls. */
  .tabs { display: flex; gap: 0; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 49px; z-index: 4; }
  .tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    color: var(--muted);
    padding: 10px 16px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: -1px;
  }
  .tab:hover { color: var(--fg); background: var(--row); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .controls { display: flex; gap: 10px; padding: 14px 20px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--bg); }
  .controls input[type="search"], .controls input[type="text"] { flex: 1 1 360px; min-width: 240px; padding: 8px 11px; background: var(--row); border: 1px solid var(--border); color: var(--fg); border-radius: 4px; font-size: 13px; transition: border-color 0.2s; }
  /* The chat-ID lookup row sits above the search controls. */
  .id-lookup { display: flex; gap: 10px; padding: 12px 20px 0 20px; align-items: center; flex-wrap: wrap; background: var(--bg); }
  .id-lookup label { color: var(--muted); font-size: 12px; }
  .id-lookup input { flex: 1 1 360px; min-width: 240px; padding: 7px 11px; background: var(--row); border: 1px solid var(--border); color: var(--fg); border-radius: 4px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  .id-lookup .hint { color: var(--muted); font-size: 11px; }
  /* Clickable session ID on result rows (click-to-copy). */
  .sid.copyable { cursor: pointer; transition: color 0.15s, background 0.15s; padding: 1px 4px; border-radius: 3px; }
  .sid.copyable:hover { background: var(--code-bg); color: var(--accent); }
  .sid.copied { color: var(--ok) !important; }
  /* While a search is in flight: dim and pulse the border on the input. Stays editable. */
  .controls input[type="search"].searching, .controls input[type="text"].searching {
    border-color: var(--accent);
    animation: search-pulse 1.2s ease-in-out infinite;
  }
  @keyframes search-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(122, 162, 247, 0.35); }
    50%      { box-shadow: 0 0 0 4px rgba(122, 162, 247, 0.08); }
  }
  .controls select { padding: 7px 9px; background: var(--row); border: 1px solid var(--border); color: var(--fg); border-radius: 4px; font-size: 13px; }
  .controls select:disabled { opacity: 0.5; cursor: not-allowed; }
  .controls label.cb { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; user-select: none; cursor: pointer; padding: 0 4px; }
  .controls label.cb input { margin: 0; cursor: pointer; }
  .controls .scope-input { flex: 0 1 200px; min-width: 120px; }
  #results, #file-name-results, #file-content-results { padding: 12px 20px; }
  .row { background: var(--row); border: 1px solid var(--border); padding: 11px 14px; margin-bottom: 9px; border-radius: 5px; border-left: 3px solid transparent; }
  .row:hover { background: var(--row-hover); }
  .row.exact { border-left-color: var(--accent); background: linear-gradient(90deg, rgba(122,162,247,0.08) 0%, rgba(122,162,247,0) 70%), var(--row); }
  .row-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .title { font-weight: 600; color: var(--fg); }
  .sid { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); font-size: 11px; }
  .ws { color: var(--accent); font-size: 12px; }
  .model { color: var(--muted); font-size: 12px; }
  .age { color: var(--muted); font-size: 12px; }
  .mcount { color: var(--muted); font-size: 12px; }
  /* Account badge: which Claude account holds the resumable JSONL for this session. */
  .acct { font-size: 11px; color: #b6c0d4; background: #2a2f3a; padding: 1px 6px; border-radius: 3px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .acct.orphaned { color: var(--error); background: #3a1d24; }
  /* Match-kind badge: 'exact' (phrase hit) vs. 'and' (AND-of-words). */
  .badge-mk { font-size: 11px; padding: 1px 6px; border-radius: 3px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .badge-mk.exact { color: var(--mark-fg); background: var(--mark-bg); font-weight: 600; }
  .badge-mk.and { color: var(--muted); background: #25272d; }
  /* Exact-phrase toggle label next to the search input. */
  .exact-toggle { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; user-select: none; cursor: pointer; padding: 0 4px; }
  .exact-toggle input { margin: 0; cursor: pointer; }
  .snippets { margin-top: 8px; padding-left: 10px; border-left: 2px solid var(--border); }
  .snippet { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; background: var(--code-bg); padding: 4px 7px; border-radius: 3px; margin: 4px 0; line-height: 1.4; color: #cdd6f4; }
  .snippet .term-label { color: var(--accent); margin-right: 6px; }
  mark { background: var(--mark-bg); color: var(--mark-fg); padding: 0 2px; border-radius: 2px; }
  .row-actions { margin-top: 9px; display: flex; gap: 6px; flex-wrap: wrap; }

  /* File-row specifics. */
  .file-path { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; color: var(--muted); word-break: break-all; }
  .file-basename { font-weight: 600; color: var(--fg); }
  .file-kind { font-size: 11px; padding: 1px 6px; border-radius: 3px; color: var(--muted); background: #25272d; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .file-kind.dir  { color: var(--accent); background: #1a2a3a; }
  .file-kind.symlink { color: #f7c878; background: #3a2a1a; }
  .file-size { color: var(--muted); font-size: 12px; }
  .file-line { color: var(--muted); font-size: 12px; }

  /* Export button — verified-flow states.
     Sequence: Export → "Exporting…" (with spinner) → "Verifying…" → "✓ Exported"
     OR on failure: "✗ Export failed". */
  .export-btn { display: inline-flex; align-items: center; gap: 6px; }
  .export-btn.is-busy { cursor: default; }
  .export-btn .btn-spinner {
    display: inline-block;
    width: 10px;
    height: 10px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  .export-btn.ok    { color: var(--ok); cursor: default; }
  .export-btn.err   { color: var(--error); }
  .export-path {
    display: block;
    margin-top: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
  }
  .export-err {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    color: var(--error);
  }

  /* Above-results live status line. Updated on every search lifecycle. */
  .search-status {
    padding: 10px 20px 0 20px;
    color: var(--muted);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 18px;
  }
  .search-status.hidden { display: none; }
  .search-status.error { color: var(--error); }
  .search-status.ok    { color: var(--ok); }

  /* Pure-CSS spinner. Visible only when .search-status carries .loading. */
  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Bottom status (kept for backward compatibility — still shows export status etc.) */
  .status { padding: 9px 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; position: sticky; bottom: 0; background: var(--bg); }
  .status.error { color: var(--error); }
  .status.ok { color: var(--ok); }
  .empty { color: var(--muted); padding: 20px; text-align: center; font-style: italic; }
  .banner { padding: 8px 20px; background: #3a2a1a; color: #f7c878; font-size: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .banner.hidden { display: none; }
  .banner .dismiss { background: transparent; border: 1px solid #6b4a1a; color: #f7c878; font-size: 11px; padding: 2px 8px; }
  .banner .dismiss:hover { background: #4a3520; }
  .perf-banner { background: #1a2a3a; color: #7aa2f7; border-bottom: 1px solid var(--border); }
  .perf-banner .dismiss { border-color: #2d4a87; color: #7aa2f7; }
  .perf-banner .dismiss:hover { background: #1f3050; }
</style>
</head>
<body>

<header>
  <h1>Conductor Chat Search</h1>
  <span class="meta" id="meta">loading…</span>
  <button id="refresh" title="Reload from DB">Refresh</button>
</header>

<div class="banner hidden" id="banner"></div>
<div class="banner perf-banner hidden" id="perf-banner">
  <span>Heads up: searches currently take 10-40s due to a known perf gap. FTS5 fix tracked at #2.</span>
  <button class="dismiss" id="perf-banner-dismiss" title="Dismiss this notice">Dismiss</button>
</div>

<nav class="tabs">
  <button class="tab active" data-tab="chats" id="tab-chats">Conductor chats</button>
  <button class="tab" data-tab="filename" id="tab-filename">Files by name</button>
  <button class="tab" data-tab="content" id="tab-content">Files by content</button>
</nav>

<!-- ========== Tab: Conductor chats (default) ========== -->
<section class="tab-panel active" data-panel="chats">
  <div class="id-lookup">
    <label for="chat-id">Chat ID:</label>
    <input id="chat-id" type="text" placeholder="paste a full UUID or any prefix ≥8 chars to jump directly to a chat" autocomplete="off" spellcheck="false">
    <button id="chat-id-clear" title="Clear the ID input">Clear ID</button>
    <span class="hint">Independent of the search box.</span>
  </div>

  <div class="controls">
    <label class="exact-toggle" title="When ON, the entire input is sent as one phrase (no word splitting).">
      <input id="exact-toggle" type="checkbox">
      Exact phrase
    </label>
    <input id="q" type="search" placeholder='Type words; space = AND' autocomplete="off" autofocus>
    <button id="clear">Clear</button>
    <select id="workspace">
      <option value="">All workspaces</option>
    </select>
    <select id="account" title="Filter by which Claude account holds this session's resumable JSONL.">
      <option value="">All accounts</option>
      <option value="__orphaned__">(orphaned)</option>
    </select>
  </div>

  <div class="search-status hidden" id="search-status"></div>
  <div id="results"><div class="empty">loading…</div></div>
</section>

<!-- ========== Tab: Files by name ========== -->
<section class="tab-panel" data-panel="filename">
  <div class="controls">
    <input id="fn-q" type="search" placeholder="filename or glob (e.g. *.md, conductor-chat-*)" autocomplete="off">
    <input id="fn-scope" type="text" class="scope-input" placeholder="/ (scope)" value="/" autocomplete="off">
    <label class="cb" title="Include dot-prefixed names like .config or .hidden.md">
      <input id="fn-hidden" type="checkbox" checked>
      Include hidden
    </label>
    <button id="fn-clear">Clear</button>
  </div>
  <div class="search-status hidden" id="fn-status"></div>
  <div id="file-name-results"><div class="empty">Type a filename pattern above.</div></div>
</section>

<!-- ========== Tab: Files by content ========== -->
<section class="tab-panel" data-panel="content">
  <div class="controls">
    <label class="exact-toggle" title="Currently all content searches are treated as literal phrases (ripgrep --fixed-strings).">
      <input id="fc-exact" type="checkbox">
      Exact phrase
    </label>
    <input id="fc-q" type="search" placeholder="phrase to search inside files" autocomplete="off">
    <input id="fc-scope" type="text" class="scope-input" placeholder="/ (scope)" value="/" autocomplete="off">
    <label class="cb" title="Search inside hidden files and dot-prefixed directories">
      <input id="fc-hidden" type="checkbox" checked>
      Include hidden
    </label>
    <button id="fc-clear">Clear</button>
  </div>
  <div class="search-status hidden" id="fc-status"></div>
  <div id="file-content-results"><div class="empty">Type a phrase above to search file contents (ripgrep).</div></div>
</section>

<div class="status" id="status">Ready.</div>

<script>
"use strict";

const $ = (s) => document.querySelector(s);
const elQ = $("#q");
const elWs = $("#workspace");
const elAcct = $("#account");
const elExactToggle = $("#exact-toggle");
const elChatId = $("#chat-id");
const elResults = $("#results");
const elStatus = $("#status");
const elSearchStatus = $("#search-status");
const elMeta = $("#meta");
const elBanner = $("#banner");
const elPerfBanner = $("#perf-banner");
// Files-by-name
const elFnQ = $("#fn-q");
const elFnScope = $("#fn-scope");
const elFnHidden = $("#fn-hidden");
const elFnStatus = $("#fn-status");
const elFnResults = $("#file-name-results");
// Files-by-content
const elFcQ = $("#fc-q");
const elFcScope = $("#fc-scope");
const elFcHidden = $("#fc-hidden");
const elFcStatus = $("#fc-status");
const elFcResults = $("#file-content-results");

const ORPHANED_SENTINEL = "__orphaned__";
// Accounts seen across all loaded rows. Used to populate the filter dropdown.
let seenAccounts = new Set();

let lastFetchToken = 0;
let debounceTimer = null;
let idDebounceTimer = null;
let fnDebounceTimer = null;
let fcDebounceTimer = null;
// AbortController for the in-flight /api/sessions request. We abort the old one
// when the user kicks off a new search, so slow requests don't pile up.
let inflightController = null;
let inflightLookupController = null;
let inflightFnController = null;
let inflightFcController = null;

const PERF_BANNER_KEY = "cchat-perf-banner-dismissed";
const EXACT_TOGGLE_KEY = "cchat-exact-toggle";
const ACTIVE_TAB_KEY = "cchat-active-tab";
const PLACEHOLDER_EXACT = "Type the exact phrase you remember";
const PLACEHOLDER_AND = "Type words; space = AND";

// Tracks which input owns the current results view: "search" or "id".
// Used so /api/sessions and /api/sessions/lookup don't clobber each other.
let activeMode = "search";

// Parse search input into structured terms.
//
// Each returned item is {value: string, exact: bool}.
//   - When the "Exact phrase" toggle is ON: the entire input is one exact term.
//   - Otherwise: whitespace = AND; "double-quoted" = one exact term.
//
// Empty / whitespace-only input → empty array.
function parseTerms(s, forceExact) {
  const trimmed = (s || "").trim();
  if (!trimmed) return [];
  if (forceExact) {
    return [{value: trimmed, exact: true}];
  }
  const terms = [];
  const re = /"([^"]+)"|(\S+)/g;
  let m;
  while ((m = re.exec(s)) !== null) {
    if (m[1] !== undefined) {
      // Came from a "quoted" chunk → exact-phrase.
      terms.push({value: m[1], exact: true});
    } else {
      terms.push({value: m[2], exact: false});
    }
  }
  return terms;
}

function relAge(iso) {
  if (!iso) return "";
  const d = new Date(iso.replace(" ", "T") + (iso.endsWith("Z") ? "" : "Z"));
  if (isNaN(d)) return iso.slice(0, 19);
  const s = Math.max(0, (Date.now() - d.getTime()) / 1000);
  if (s < 60) return Math.floor(s) + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 86400 * 30) return Math.floor(s / 86400) + "d ago";
  return d.toISOString().slice(0, 10);
}

function fmtBytes(n) {
  if (n == null || isNaN(n)) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + " MB";
  return (n / 1024 / 1024 / 1024).toFixed(1) + " GB";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// Convert «term» markers (from server-side snippets) into <mark>term</mark>.
function snippetHtml(text) {
  const escaped = escapeHtml(text);
  return escaped.replace(/«([^»]+)»/g, "<mark>$1</mark>");
}

function buildQS(params) {
  const usp = new URLSearchParams();
  for (const [k, v] of params) {
    if (v === undefined || v === null || v === "") continue;
    usp.append(k, v);
  }
  return usp.toString();
}

async function fetchJson(url, init) {
  const r = await fetch(url, init);
  let body = null;
  try { body = await r.json(); } catch (_) {}
  if (!r.ok) {
    const msg = (body && body.error) ? body.error : `HTTP ${r.status}`;
    throw new Error(msg);
  }
  return body;
}

function setStatus(text, cls) {
  elStatus.className = "status" + (cls ? " " + cls : "");
  elStatus.textContent = text;
}

// Update a live status line. ``el`` is the target element. cls one of:
// "", "loading", "ok", "error". Pass null/empty text to hide.
function setStatusLine(el, text, cls) {
  if (!text) {
    el.className = "search-status hidden";
    el.textContent = "";
    return;
  }
  el.className = "search-status" + (cls ? " " + cls : "");
  if (cls === "loading") {
    el.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>' + escapeHtml(text) + '</span>';
  } else {
    el.textContent = text;
  }
}

// Convenience wrapper kept for the existing chat-tab code paths.
function setSearchStatus(text, cls) { setStatusLine(elSearchStatus, text, cls); }

// Toggle the "search in progress" affordance: dim+pulse the input border,
// disable the workspace dropdown, disable all visible Export buttons.
function setSearchingUi(active) {
  elQ.classList.toggle("searching", active);
  elWs.disabled = active;
  const exportBtns = elResults.querySelectorAll(".export-btn");
  exportBtns.forEach((b) => {
    // Don't override buttons that were already disabled for their own reasons
    // (e.g. their own export in flight) — those have data-busy=1.
    if (b.dataset.busy === "1") return;
    b.disabled = active;
  });
}

async function loadWorkspaces() {
  try {
    const ws = await fetchJson("/api/workspaces");
    elWs.innerHTML = '<option value="">All workspaces</option>' +
      ws.map((w) => `<option value="${escapeHtml(w.id)}">${escapeHtml(w.directory_name || w.id)}</option>`).join("");
  } catch (e) {
    setStatus("Failed to load workspaces: " + e.message, "error");
  }
}

async function loadHealth() {
  try {
    const h = await fetchJson("/api/health");
    const parts = [];
    parts.push(h.schema_version ? `schema ${h.schema_version}` : "schema unknown");
    if (typeof h.accounts_indexed === "number") {
      parts.push(`${h.accounts_indexed} session(s) indexed across Claude accounts`);
    }
    elMeta.textContent = parts.join(" · ");
    if (h.schema_warning) {
      elBanner.textContent = h.schema_warning;
      elBanner.classList.remove("hidden");
    }
  } catch (_) {
    elMeta.textContent = "(health unknown)";
  }
}

async function loadSessions() {
  activeMode = "search";
  // Abort any in-flight request so the user's new query takes over immediately.
  if (inflightController) {
    inflightController.abort();
    inflightController = null;
  }
  if (inflightLookupController) {
    inflightLookupController.abort();
    inflightLookupController = null;
  }
  const controller = new AbortController();
  inflightController = controller;

  const token = ++lastFetchToken;
  const terms = parseTerms(elQ.value, elExactToggle.checked);
  const wsid = elWs.value;
  const acct = elAcct.value;
  const params = [];
  for (const t of terms) {
    params.push([t.exact ? "q_exact" : "q", t.value]);
  }
  if (wsid) params.push(["workspace", wsid]);
  if (acct) params.push(["account", acct]);
  const url = "/api/sessions" + (params.length ? "?" + buildQS(params) : "");

  // Status line above results
  if (terms.length) {
    const shown = terms.map((t) => t.exact ? `«${t.value}»` : `"${t.value}"`).join(" + ");
    setSearchStatus(`Searching for ${shown}…`, "loading");
  } else {
    setSearchStatus(null);
  }
  setStatus(terms.length ? `Searching for ${terms.length} term(s)…` : "Loading…");
  setSearchingUi(true);
  const tStart = performance.now();
  try {
    const data = await fetchJson(url, { signal: controller.signal });
    if (token !== lastFetchToken) return; // stale response (shouldn't fire since we abort, but defensive)
    const elapsed = ((performance.now() - tStart) / 1000).toFixed(1);
    updateSeenAccounts(data);
    render(data, terms);
    if (terms.length) {
      const shown = terms.map((t) => t.exact ? `«${t.value}»` : `"${t.value}"`).join(" + ");
      setSearchStatus(`Found ${data.length} match${data.length === 1 ? "" : "es"} for ${shown} in ${elapsed}s`, "ok");
    } else {
      setSearchStatus(null);
    }
    setStatus(`${data.length} session(s)${terms.length ? " matching all terms" : ""}.`);
  } catch (e) {
    // An aborted request is expected behaviour — caller already kicked off a new search.
    if (e.name === "AbortError") return;
    if (token !== lastFetchToken) return;
    elResults.innerHTML = '<div class="empty">Error: ' + escapeHtml(e.message) + "</div>";
    setSearchStatus("Search failed: " + e.message, "error");
    setStatus("Error: " + e.message, "error");
  } finally {
    if (inflightController === controller) {
      inflightController = null;
      setSearchingUi(false);
    }
  }
}

// Walk the loaded rows and add any unseen account names to the filter dropdown.
// Preserves current selection if still valid. Builds the dropdown each call;
// cost is negligible (handful of accounts max).
function updateSeenAccounts(rows) {
  let changed = false;
  for (const r of rows) {
    if (r && r.account && !seenAccounts.has(r.account)) {
      seenAccounts.add(r.account);
      changed = true;
    }
  }
  if (!changed) return;
  const current = elAcct.value;
  const sortedAccounts = Array.from(seenAccounts).sort();
  const opts = ['<option value="">All accounts</option>'];
  for (const a of sortedAccounts) {
    opts.push(`<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`);
  }
  opts.push('<option value="__orphaned__">(orphaned)</option>');
  elAcct.innerHTML = opts.join("");
  // Restore previous selection if it still exists.
  if (current && Array.from(elAcct.options).some(o => o.value === current)) {
    elAcct.value = current;
  }
}

function render(sessions, terms) {
  if (!sessions.length) {
    elResults.innerHTML = '<div class="empty">No sessions match.' +
      (terms.length > 1 ? " Try fewer terms." : "") + "</div>";
    return;
  }
  const parts = sessions.map((s) => {
    const sid = escapeHtml(s.session_id || s.id || "");
    const title = escapeHtml(s.title || "(no title)");
    const ws = escapeHtml(s.workspace_name || "?");
    const model = escapeHtml(s.model || "?");
    const age = escapeHtml(relAge(s.updated_at || s.last_user_message_at || s.created_at));
    const mc = (s.message_count == null) ? "" : `${s.message_count} msgs`;
    // Account badge: which Claude account holds this session's resumable JSONL.
    let acctHtml = "";
    if (s.account === null || s.account === undefined) {
      acctHtml = '<span class="acct orphaned" title="No Claude account holds the resumable JSONL for this session — Claude Code cannot resume it.">(orphaned)</span>';
    } else {
      acctHtml = `<span class="acct" title="Resumable JSONL lives under ~/.claude${s.account === "default" ? "" : "-" + s.account}/projects/">${escapeHtml(s.account)}</span>`;
    }
    // Match-kind badge: exact-phrase vs. AND-of-words.
    const mk = s.match_kind === "exact" ? "exact" : "and";
    const mkLabel = mk === "exact" ? "🎯 exact" : "🔍 and";
    const mkHtml = `<span class="badge-mk ${mk}" title="${mk === "exact" ? "Matched as a contiguous phrase" : "Matched all words (AND)"}">${mkLabel}</span>`;
    // Hidden-flag indicator (only relevant on ID-lookup rows; search/listing already skips them).
    const hiddenHtml = s.is_hidden ? '<span class="acct orphaned" title="This chat is hidden in Conductor (archived/dismissed). Pasted ID lookups still surface it.">(hidden)</span>' : "";
    let snippetsHtml = "";
    if (Array.isArray(s.snippets) && s.snippets.length) {
      snippetsHtml = '<div class="snippets">' + s.snippets.map((sn) =>
        `<div class="snippet"><span class="term-label">${escapeHtml(sn.term)}:</span>${snippetHtml(sn.text)}</div>`
      ).join("") + "</div>";
    }
    const rowClass = "row" + (mk === "exact" ? " exact" : "");
    return `
      <div class="${rowClass}" data-sid="${sid}">
        <div class="row-head">
          <span class="title">${title}</span>
          ${mkHtml}
          ${hiddenHtml}
          <span class="ws">${ws}</span>
          ${acctHtml}
          <span class="model">${model}</span>
          <span class="age">${age}</span>
          <span class="mcount">${escapeHtml(mc)}</span>
          <span class="sid copyable" data-sid="${sid}" title="Click to copy chat ID">${sid}</span>
        </div>
        ${snippetsHtml}
        <div class="row-actions">
          <button class="export-btn" data-sid="${sid}">Export ↓</button>
        </div>
      </div>
    `;
  });
  elResults.innerHTML = parts.join("");
}

// Feature A — Chat ID lookup. Hits /api/sessions/lookup?id=<value>.
// Renders results into the same list area; clears the search box's view.
async function loadById() {
  const raw = (elChatId.value || "").trim();
  if (!raw) {
    // ID box cleared. Don't auto-rerun a normal search — let the user choose.
    if (activeMode === "id") {
      elResults.innerHTML = '<div class="empty">Paste a Chat ID above, or use the search box below.</div>';
      setSearchStatus(null);
      setStatus("Ready.");
    }
    return;
  }
  if (raw.length < 8) {
    elResults.innerHTML = '<div class="empty">Chat ID needs at least 8 characters.</div>';
    setSearchStatus("ID too short — need 8+ characters.", "error");
    setStatus("Ready.");
    activeMode = "id";
    return;
  }

  activeMode = "id";
  // Cancel any in-flight search so its response doesn't overwrite our results.
  if (inflightController) {
    inflightController.abort();
    inflightController = null;
  }
  if (inflightLookupController) {
    inflightLookupController.abort();
    inflightLookupController = null;
  }
  const controller = new AbortController();
  inflightLookupController = controller;
  const token = ++lastFetchToken;

  const url = "/api/sessions/lookup?id=" + encodeURIComponent(raw);
  setSearchStatus(`Looking up chat by id: ${raw}…`, "loading");
  setStatus(`Looking up ${raw}…`);
  setSearchingUi(true);
  const tStart = performance.now();
  try {
    const data = await fetchJson(url, { signal: controller.signal });
    if (token !== lastFetchToken) return;
    const elapsed = ((performance.now() - tStart) / 1000).toFixed(2);
    updateSeenAccounts(data);
    if (data.length === 0) {
      elResults.innerHTML = '<div class="empty">No chat with that ID.</div>';
      setSearchStatus(`No chat with that ID. (${elapsed}s)`, "ok");
      setStatus("No match.");
    } else {
      render(data, []);
      const label = data.length === 1 ? "1 match" : `${data.length} matches`;
      setSearchStatus(`Found ${label} for id ${raw} in ${elapsed}s`, "ok");
      setStatus(`${data.length} session(s) by ID.`);
    }
  } catch (e) {
    if (e.name === "AbortError") return;
    if (token !== lastFetchToken) return;
    elResults.innerHTML = '<div class="empty">Error: ' + escapeHtml(e.message) + "</div>";
    setSearchStatus("Lookup failed: " + e.message, "error");
    setStatus("Error: " + e.message, "error");
  } finally {
    if (inflightLookupController === controller) {
      inflightLookupController = null;
      setSearchingUi(false);
    }
  }
}

// ============================================================
//   Tab: Files by name
// ============================================================

function renderFileNameRows(rows) {
  if (!rows.length) {
    elFnResults.innerHTML = '<div class="empty">No files match.</div>';
    return;
  }
  const parts = rows.map((r, idx) => {
    const path = escapeHtml(r.path);
    const basename = escapeHtml(r.basename);
    const parent = escapeHtml(r.parent_dir || "");
    const size = escapeHtml(fmtBytes(r.size_bytes));
    const age = escapeHtml(relAge(r.mtime_iso));
    const kind = escapeHtml(r.kind || "file");
    return `
      <div class="row" data-row-idx="${idx}" data-path="${path}">
        <div class="row-head">
          <span class="file-basename">${basename}</span>
          <span class="file-kind ${kind}">${kind}</span>
          <span class="file-size">${size}</span>
          <span class="age">${age}</span>
        </div>
        <div class="file-path">${parent}/</div>
        <div class="row-actions">
          <button class="reveal-btn" data-path="${path}">Reveal in Finder</button>
          <button class="copy-btn" data-path="${path}">Copy to Downloads</button>
        </div>
      </div>
    `;
  });
  elFnResults.innerHTML = parts.join("");
}

async function loadFilesByName() {
  const q = (elFnQ.value || "").trim();
  if (!q) {
    elFnResults.innerHTML = '<div class="empty">Type a filename pattern above.</div>';
    setStatusLine(elFnStatus, null);
    return;
  }
  if (inflightFnController) inflightFnController.abort();
  const controller = new AbortController();
  inflightFnController = controller;
  const params = [["q", q]];
  const scope = (elFnScope.value || "/").trim() || "/";
  if (scope !== "/") params.push(["scope", scope]);
  params.push(["include_hidden", elFnHidden.checked ? "true" : "false"]);
  const url = "/api/files/by-name?" + buildQS(params);
  setStatusLine(elFnStatus, `Searching for «${q}» under ${scope}…`, "loading");
  elFnQ.classList.add("searching");
  const tStart = performance.now();
  try {
    const data = await fetchJson(url, {signal: controller.signal});
    const elapsed = ((performance.now() - tStart) / 1000).toFixed(2);
    renderFileNameRows(data);
    setStatusLine(elFnStatus, `Found ${data.length} file${data.length === 1 ? "" : "s"} in ${elapsed}s`, "ok");
  } catch (e) {
    if (e.name === "AbortError") return;
    elFnResults.innerHTML = '<div class="empty">Error: ' + escapeHtml(e.message) + "</div>";
    setStatusLine(elFnStatus, "Search failed: " + e.message, "error");
  } finally {
    if (inflightFnController === controller) inflightFnController = null;
    elFnQ.classList.remove("searching");
  }
}

// ============================================================
//   Action handlers — Reveal / Copy (shared by both file tabs)
// ============================================================

async function handleRevealClick(btn) {
  const path = btn.dataset.path;
  if (!path) return;
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Revealing…";
  try {
    const r = await fetchJson("/api/files/reveal", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({path}),
    });
    if (r.ok) {
      btn.textContent = "✓ Revealed";
      setStatus(`Revealed ${path} in Finder.`, "ok");
    } else {
      throw new Error(r.error || "reveal failed");
    }
  } catch (e) {
    btn.textContent = "✗ Failed";
    setStatus("Reveal failed: " + e.message, "error");
  } finally {
    setTimeout(() => {
      btn.textContent = orig;
      btn.disabled = false;
    }, 1200);
  }
}

async function handleCopyClick(btn) {
  const path = btn.dataset.path;
  if (!path) return;
  btn.disabled = true;
  btn.dataset.busy = "1";
  btn.classList.remove("ok", "err");
  // Remove any path/error block from a previous attempt.
  const prevPath = btn.parentElement.querySelector(".export-path");
  if (prevPath) prevPath.remove();
  const prevErr = btn.parentElement.querySelector(".export-err");
  if (prevErr) prevErr.remove();
  btn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span>Copying…';
  setStatus(`Copying ${path}…`);
  try {
    const r = await fetchJson("/api/files/copy-to-downloads", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({path}),
    });
    btn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span>Verifying…';
    await new Promise((res) => setTimeout(res, 300));
    if (!r.verified) throw new Error("server did not return verified=true");
    setStatus(`Wrote ${r.copied_to} (${r.bytes} bytes, verified)`, "ok");
    try { await navigator.clipboard.writeText(r.copied_to); } catch (_) {}
    btn.classList.add("ok");
    btn.textContent = "✓ Copied";
    const pathEl = document.createElement("span");
    pathEl.className = "export-path";
    pathEl.textContent = r.copied_to;
    btn.parentElement.appendChild(pathEl);
  } catch (e) {
    setStatus("Copy failed: " + e.message, "error");
    btn.classList.remove("is-busy");
    btn.classList.add("err");
    btn.textContent = "✗ Copy failed";
    const errEl = document.createElement("span");
    errEl.className = "export-err";
    errEl.textContent = e.message;
    btn.parentElement.appendChild(errEl);
    setTimeout(() => {
      btn.disabled = false;
      btn.classList.remove("err");
      btn.textContent = "Copy to Downloads";
      delete btn.dataset.busy;
      if (errEl.parentElement) errEl.remove();
    }, 3000);
  }
}

// Delegate clicks on both file-result lists to the action handlers.
function wireFileResultClicks(container) {
  container.addEventListener("click", async (ev) => {
    const revealBtn = ev.target.closest(".reveal-btn");
    if (revealBtn) { await handleRevealClick(revealBtn); return; }
    const copyBtn = ev.target.closest(".copy-btn");
    if (copyBtn) { await handleCopyClick(copyBtn); return; }
  });
}
wireFileResultClicks(elFnResults);
wireFileResultClicks(elFcResults);

// ============================================================
//   Tab switching
// ============================================================

function activateTab(name) {
  // Buttons
  document.querySelectorAll(".tab").forEach((b) => {
    b.classList.toggle("active", b.dataset.tab === name);
  });
  // Panels
  document.querySelectorAll(".tab-panel").forEach((p) => {
    p.classList.toggle("active", p.dataset.panel === name);
  });
  // Persist
  try { localStorage.setItem(ACTIVE_TAB_KEY, name); } catch (_) {}
  // Focus the relevant input.
  if (name === "chats") elQ.focus();
  else if (name === "filename") elFnQ.focus();
  else if (name === "content") elFcQ.focus();
}

document.querySelectorAll(".tab").forEach((b) => {
  b.addEventListener("click", () => activateTab(b.dataset.tab));
});

function initActiveTab() {
  let saved = null;
  try { saved = localStorage.getItem(ACTIVE_TAB_KEY); } catch (_) {}
  if (saved && ["chats", "filename", "content"].includes(saved)) {
    activateTab(saved);
  }
}

// Apply persisted exact-phrase toggle state and keep the placeholder in sync.
function applyExactToggle() {
  elQ.placeholder = elExactToggle.checked ? PLACEHOLDER_EXACT : PLACEHOLDER_AND;
}

function initExactToggle() {
  let saved = null;
  try { saved = localStorage.getItem(EXACT_TOGGLE_KEY); } catch (_) {}
  if (saved === "1") elExactToggle.checked = true;
  applyExactToggle();
}

elResults.addEventListener("click", async (ev) => {
  // Click-to-copy on the session id chip.
  const sidEl = ev.target.closest(".sid.copyable");
  if (sidEl) {
    const sid = sidEl.dataset.sid || sidEl.textContent;
    try { await navigator.clipboard.writeText(sid); } catch (_) {}
    sidEl.classList.add("copied");
    const prev = sidEl.textContent;
    sidEl.textContent = "copied ✓";
    setTimeout(() => {
      sidEl.classList.remove("copied");
      sidEl.textContent = prev;
    }, 900);
    return;
  }
  const btn = ev.target.closest(".export-btn");
  if (!btn) return;
  const sid = btn.dataset.sid;
  btn.disabled = true;
  btn.dataset.busy = "1";
  btn.classList.add("is-busy");
  btn.classList.remove("ok", "err");
  // Remove any path/error block that may be hanging on from a previous attempt.
  const prevPath = btn.parentElement.querySelector(".export-path");
  if (prevPath) prevPath.remove();
  const prevErr = btn.parentElement.querySelector(".export-err");
  if (prevErr) prevErr.remove();
  btn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span>Exporting…';
  setStatus(`Exporting ${sid}…`);
  try {
    const r = await fetchJson("/api/export", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sid, mode: "clean" }),
    });
    // Server returned success — now flip the label to "Verifying…" briefly
    // so the user sees there's a verification step happening. The server
    // already did the actual verify; this delay is cosmetic.
    btn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span>Verifying…';
    await new Promise((res) => setTimeout(res, 500));
    if (!r.verified) {
      // Server returned 200 but didn't include verified=true. That's a contract
      // violation — treat it as a failure so we never claim "Exported" without
      // verification.
      throw new Error("server did not return verified=true");
    }
    setStatus(`Wrote ${r.path} (${r.verified_size_bytes} bytes, ${r.messages} msgs, verified)`, "ok");
    try { await navigator.clipboard.writeText(r.path); } catch (_) {}
    btn.classList.add("ok");
    btn.textContent = "✓ Exported";
    // Show the path beneath the button.
    const pathEl = document.createElement("span");
    pathEl.className = "export-path";
    pathEl.textContent = r.path;
    btn.parentElement.appendChild(pathEl);
    // Stays disabled — verified successful exports don't re-enable.
  } catch (e) {
    setStatus("Export failed: " + e.message, "error");
    btn.classList.remove("is-busy");
    btn.classList.add("err");
    btn.textContent = "✗ Export failed";
    const errEl = document.createElement("span");
    errEl.className = "export-err";
    errEl.textContent = e.message;
    btn.parentElement.appendChild(errEl);
    // Re-enable after 3s so user can retry.
    setTimeout(() => {
      btn.disabled = false;
      btn.classList.remove("err");
      btn.textContent = "Export ↓";
      delete btn.dataset.busy;
      if (errEl.parentElement) errEl.remove();
    }, 3000);
  }
});

elQ.addEventListener("input", () => {
  // Using the search box clears the ID-lookup view so the two never collide.
  if (elChatId.value) {
    elChatId.value = "";
  }
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(loadSessions, 200);
});

elChatId.addEventListener("input", () => {
  clearTimeout(idDebounceTimer);
  idDebounceTimer = setTimeout(loadById, 150);
});

elChatId.addEventListener("paste", () => {
  // Trigger a near-immediate lookup after paste.
  clearTimeout(idDebounceTimer);
  idDebounceTimer = setTimeout(loadById, 30);
});

  elChatId.value = "";

  elQ.value = "";

$("#refresh").addEventListener("click", () => {
  loadHealth();
  if (activeMode === "id" && elChatId.value.trim()) {
    loadById();
  } else {
    loadSessions();
  }
});

elWs.addEventListener("change", () => {
  if (activeMode === "id") return; // workspace filter doesn't apply to ID lookup
  loadSessions();
});
elAcct.addEventListener("change", () => {
  if (activeMode === "id") return;
  loadSessions();
});
elExactToggle.addEventListener("change", () => {

  try { localStorage.setItem(EXACT_TOGGLE_KEY, elExactToggle.checked ? "1" : "0"); } catch (_) {}
  applyExactToggle();
  loadSessions();
});

// Files-by-name tab wiring
elFnQ.addEventListener("input", () => {
  clearTimeout(fnDebounceTimer);
  fnDebounceTimer = setTimeout(loadFilesByName, 300);
});
elFnQ.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { clearTimeout(fnDebounceTimer); loadFilesByName(); }

elFnScope.addEventListener("change", loadFilesByName);
elFnHidden.addEventListener("change", () => { if (elFnQ.value.trim()) loadFilesByName(); });
$("#fn-clear").addEventListener("click", () => {
  elFnQ.value = "";
  elFnResults.innerHTML = '<div class="empty">Type a filename pattern above.</div>';
  setStatusLine(elFnStatus, null);
  elFnQ.focus();
});

// Files-by-content tab wiring
elFcQ.addEventListener("input", () => {
  clearTimeout(fcDebounceTimer);
  fcDebounceTimer = setTimeout(loadFilesByContent, 400);
});
elFcQ.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { clearTimeout(fcDebounceTimer); loadFilesByContent(); }
});
elFcScope.addEventListener("change", loadFilesByContent);
elFcHidden.addEventListener("change", () => { if (elFcQ.value.trim()) loadFilesByContent(); });
$("#fc-clear").addEventListener("click", () => {
  elFcQ.value = "";
  elFcResults.innerHTML = '<div class="empty">Type a phrase above to search file contents (ripgrep).</div>';
  setStatusLine(elFcStatus, null);
  elFcQ.focus();
});

// Perf banner (issue #2) — dismissible, sticky via localStorage.
function initPerfBanner() {
  let dismissed = false;
  try { dismissed = localStorage.getItem(PERF_BANNER_KEY) === "1"; } catch (_) {}
  if (!dismissed) elPerfBanner.classList.remove("hidden");
  $("#perf-banner-dismiss").addEventListener("click", () => {
    elPerfBanner.classList.add("hidden");
    try { localStorage.setItem(PERF_BANNER_KEY, "1"); } catch (_) {}
  });
}

// Initial load
initPerfBanner();
initExactToggle();
initActiveTab();
loadHealth();
loadWorkspaces();
loadSessions();
